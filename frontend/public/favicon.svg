<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Chapa azul metalizada -->
    <linearGradient id="plate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15425A"/>
      <stop offset="55%" stop-color="#0F3341"/>
      <stop offset="100%" stop-color="#0B2041"/>
    </linearGradient>
    <!-- Elementos claros del isologo -->
    <linearGradient id="light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#A3C9DD"/>
    </linearGradient>
    <!-- Acento rojo conservado del logo -->
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A00"/>
      <stop offset="100%" stop-color="#B31D00"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="38" fill="url(#plate)"/>
  <!-- Filo superior claro: lo que da la lectura metálica -->
  <rect x="1" y="1" width="198" height="198" rx="37" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="2"/>

  <!-- Anillo de engranaje -->
  <circle cx="100" cy="100" r="62" fill="none" stroke="url(#light)" stroke-width="13" stroke-dasharray="23.5 9"/>
  <!-- Anillo interior de acento -->
  <circle cx="100" cy="100" r="45" fill="none" stroke="url(#red)" stroke-width="4.5"/>

  <!-- Monograma "R" inclinado -->
  <g transform="translate(100 100) skewX(-12) scale(0.52) translate(-106 -95)">
    <path d="M 65,45 L 115,45 C 135,45 148,55 148,75 C 148,90 138,102 122,106 L 148,145 L 118,145 L 96,110 L 88,110 L 88,145 L 65,145 Z M 88,66 L 88,90 L 112,90 C 120,90 124,85 124,78 C 124,71 120,66 112,66 Z" fill="url(#light)"/>
  </g>
</svg>
